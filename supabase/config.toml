# McCoy Supabase local/CLI config
# https://supabase.com/docs/guides/cli/config

project_id = "mccoy"

[api]
enabled = true
# private is reachable only with service_role grants (anon/authenticated have no USAGE/table rights).
schemas = ["public", "private", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true

[auth]
enabled = true
enable_signup = false
# Customer portal / storefront qualification (E2E uses 5183; local Vite often 5173).
site_url = "http://localhost:5183"
additional_redirect_urls = [
  "http://localhost:5183",
  "http://localhost:5183/**",
  "http://127.0.0.1:5183",
  "http://127.0.0.1:5183/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/**",
  "http://localhost:5184",
  "http://localhost:5184/**",
  "http://127.0.0.1:5184",
  "http://127.0.0.1:5184/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

[auth.email.template.invite]
subject = "Uitnodiging voor McCoy Admin"
content_path = "./supabase/templates/invite.html"
