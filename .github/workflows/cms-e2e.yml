name: CMS Playwright E2E

on:
  push:
    branches: [main, master, staging]
  pull_request:

concurrency:
  group: cms-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      ADMIN_LEGACY_AUTH: "true"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: e2e-local-only-not-production
      ADMIN_SESSION_SECRET: e2e-session-secret-min-32-chars-long
      VITE_ADMIN_ORIGIN: http://localhost:5174
      VITE_STOREFRONT_ORIGIN: http://localhost:5173
      E2E_ADMIN_ORIGIN: http://localhost:5174
      E2E_STOREFRONT_ORIGIN: http://localhost:5173
      HOST_ENFORCE: auto
      # Storefront production client bundling still pulls Node builtins via TanStack Start.
      # Prefer Vite preview when E2E_USE_DEV is unset and builds succeed locally.
      E2E_USE_DEV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run CMS E2E (CI gate)
        run: npm run test:e2e:ci
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
